name: Build & Release (macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v3.0.19)'
        required: false
        default: 'v3.0.19'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Universal DMG)
    runs-on: macos-15
    steps:
      - name: Setup Xcode on macOS 15
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: libcore/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install macOS build dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg tree || true
          npm install -g appdmg || true
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Prepare Libcore binaries
        run: |
          mkdir -p libcore/bin
          cd libcore
          echo "=== Compiling native arm64 libcore.dylib ==="
          export CGO_ENABLED=1
          export MACOSX_DEPLOYMENT_TARGET=10.15
          export CGO_CFLAGS="-mmacosx-version-min=10.15"
          export CGO_LDFLAGS="-mmacosx-version-min=10.15"
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_dhcp,with_low_memory,with_conntrack"

          if ! GOOS=darwin GOARCH=arm64 go build -v -trimpath -tags "$TAGS" -buildmode=c-shared -o bin/libcore.dylib ./custom 2>&1 | tee /tmp/arm64.log; then
            ERR_MSG=$(tail -n 25 /tmp/arm64.log | tr '\r\n' '  ')
            echo "::error title=ARM64_BUILD_ERROR::$ERR_MSG"
            exit 1
          fi

          echo "=== Compiling amd64 libcore.dylib ==="
          printf '#!/bin/sh\nexec clang -arch x86_64 -mmacosx-version-min=10.15 "$@"\n' > /tmp/x86_64-clang
          chmod +x /tmp/x86_64-clang

          if CC=/tmp/x86_64-clang GOOS=darwin GOARCH=amd64 go build -v -trimpath -tags "$TAGS" -buildmode=c-shared -o bin/libcore-amd64.dylib ./custom 2>&1 | tee /tmp/amd64.log; then
            echo "Merging into Universal binary..."
            lipo -create bin/libcore.dylib bin/libcore-amd64.dylib -output bin/libcore-universal.dylib
            mv bin/libcore-universal.dylib bin/libcore.dylib
            rm -f bin/libcore-amd64.dylib
          else
            echo "amd64 cross-compile failed, keeping native arm64"
          fi

          cd ..
          ls -lh libcore/bin/libcore.dylib

      - name: Prepare Flutter code generation & translations
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Pre-install & patch Pods for Xcode 16.4+
        run: |
          cd macos
          pod install || true
          find Pods -type f \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i '' -E 's/std::vector<const ([^>]+)>/std::vector<\1>/g' {} + 2>/dev/null || true
          cd ..

      - name: Build macOS DMG
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          xattr -cr . || true
          flutter_distributor package --platform macos --targets dmg --skip-clean --build-target lib/main.dart

      - name: Collect macOS packages
        run: |
          mkdir -p out
          find dist -type f -name "*.dmg" -exec cp {} out/ \;
          ls -la out/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: out/*
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: needs.build-macos.result == 'success'
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -lh out/

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            [ -z "$TAG" ] && TAG="v3.0.19"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v3.0.19"
          fi
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Hiddify ${{ steps.tag.outputs.release_tag }}
          draft: false
          prerelease: false
          files: out/*
          body: |
            ## Hiddify ${{ steps.tag.outputs.release_tag }} (macOS)

            ### Included Builds:
            - **macOS**: DMG (Universal: Apple Silicon & Intel)

            ### What's New:
            - **macOS VPN (TUN Mode) Privilege & Reconnect Fix**:
              - Fixed `initialize inbound/tun[tun-in]: configure tun interface: Connect: operation not permitted` error when switching to VPN (Experimental) mode while already connected
              - Added pre-flight privilege check in `reconnect()` and immediate `MissingPrivilegeDialog` prompt when selecting VPN mode in Quick Settings
              - Mapped `operation not permitted` / `permission denied` TUN interface errors directly to interactive administrator privilege authorization
              - Enhanced macOS `osascript` privilege elevation (`nohup` & `HOME` environment preservation) and native `libcore` tunnel service elevation
            - **macOS Monterey (12.4 ~ 12.7.6) & Intel / Apple Silicon Universal Support**:
              - Fixed `EXC_BAD_ACCESS 0x10` crash by removing dock tile badge in accessory mode and restoring `super.applicationDidFinishLaunching`
              - Added interactive `MissingPrivilegeDialog` with one-click native macOS Administrator Authorization & Relaunch (`osascript with administrator privileges`) to seamlessly enable VPN (TUN) mode without manual terminal steps
              - Specified `MACOSX_DEPLOYMENT_TARGET=10.15` and `-mmacosx-version-min=10.15` for full backward binary compatibility across macOS Monterey, Ventura, Sonoma, and Sequoia
            - **Desktop Stability & System Tray Fixes**:
              - Completely resolved desktop UI thread freeze and unclickable states
              - Fixed transparent tray icon and blank unclickable right-click context menu
              - Added background window visibility listeners to pause animation when minimized/hidden to tray (zero idle CPU usage)
              - Hardened Clash API polling with concurrency locks and cached controller credentials
            - **Dynamic Connection Topology (连接流向)**:
              - Separate independent traffic counters (real-time speed & cumulative volume) for Proxy (代理) and Direct (直连)
              - Dynamic photon particle acceleration (up to 3.2x) and glowing comet tails responding to real-time site data flow (e.g. streaming video)
              - Visual flow partitioning for Proxy and Direct routes with full-screen expansion on double click
              - Quick routing actions: set Proxy, Direct, or clear custom rules with right-click or tap
              - Built-in Custom Domain Rules Manager (规则管理) with deletion and manual additions
              - Window Always-on-top (置顶) shortcut and collapse/expand controls
            - Fully supports AnyTLS protocol (`anytls://` link, subscription URLs, JSON configs)
            - Restored official 2.5.7 connection button UX (yellow-brown breathing glow on connecting, Wi-Fi icon, latency ping shimmer, connecting node display)
            - Support for `sing-box://` and `sinbox://` deep link imports (with auto profile naming)
            - Fully supports Hysteria 2 Port Hopping (`mport`, `ports`, `server_ports`, and authority ranges) with per-connection port randomization
            - Optimized domestic direct connection: DNS HTTPS/SVCB filtering & IPv4 direct strategy to prevent domestic website buffering
            - UI improvements: Connection Topology hidden by default, Logs default to paused
            - macOS single-proxy node auto-default selection support
