name: Release Android ARM64 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version name (e.g. 3.0.17)"
        required: true
        default: "3.0.17"
      build_number:
        description: "Android versionCode (e.g. 30017)"
        required: true
        default: "30017"
      publish_release:
        description: "Create GitHub Release"
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "17"
      FLUTTER_VERSION: "3.24.3"
      GO_VERSION: "1.22.5"
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version info
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%+*}"
            PATCH="${PATCH:-0}"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build-tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: libcore/go.sum

      - name: Install gomobile and build libcore.aar (arm64)
        working-directory: libcore
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          gomobile init
          mkdir -p bin
          gomobile bind -v \
            -androidapi=21 \
            -javapkg "io.nekohasekai" \
            -libname box \
            -target android/arm64 \
            -trimpath \
            -ldflags "-s -w" \
            -tags "with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api,with_grpc" \
            -o "bin/libcore.aar" \
            github.com/sagernet/sing-box/experimental/libbox ./mobile
          ls -lh bin/libcore.aar

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get Flutter dependencies & generate code
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Configure Android release signing (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          flutter build apk \
            --release \
            --target lib/main.dart \
            --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/Hiddify-v${{ steps.version.outputs.version }}-android-arm64.apk"
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-v${{ steps.version.outputs.version }}-android-arm64
          path: dist/Hiddify-v${{ steps.version.outputs.version }}-android-arm64.apk

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Hiddify v${{ steps.version.outputs.version }} (Android ARM64)
          files: dist/Hiddify-v${{ steps.version.outputs.version }}-android-arm64.apk
          generate_release_notes: true
